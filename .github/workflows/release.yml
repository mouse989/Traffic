name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          npm ci --prefix frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Copy frontend dist to backend static
        run: cp -r frontend/dist backend/app/static

      - name: Build Linux binary
        run: pyinstaller --clean traffic.spec
        working-directory: backend

      - name: Rename binary
        run: mv backend/dist/traffic backend/dist/traffic-linux

      - uses: actions/upload-artifact@v4
        with:
          name: traffic-linux
          path: backend/dist/traffic-linux

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          npm ci --prefix frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Copy frontend dist to backend static
        run: xcopy /E /I /Y frontend\dist backend\app\static
        shell: cmd

      - name: Build Windows binary
        run: pyinstaller --clean traffic.spec
        working-directory: backend

      - uses: actions/upload-artifact@v4
        with:
          name: traffic-windows
          path: backend/dist/traffic.exe

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: traffic-linux
          path: ./artifacts

      - uses: actions/download-artifact@v4
        with:
          name: traffic-windows
          path: ./artifacts

      - name: Make Linux binary executable
        run: chmod +x ./artifacts/traffic-linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/traffic-linux
            ./artifacts/traffic.exe
          generate_release_notes: true

